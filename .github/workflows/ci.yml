name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (ruff — hanya kelas kesalahan yang memecahkan runtime)
        run: |
          pip install ruff==0.6.9
          ruff check backend --select F821,F811,F401,E9 --exclude backend/routes/_archive
      - name: Uji unit hermetik (tanpa Mongo)
        run: |
          # versi diambil dari requirements.txt; uji unit mengimpor auth (PyJWT, bcrypt, motor, dotenv),
          # rute unggah berkas (python-multipart), ekspor Excel (openpyxl), dateutil, pencetak label
          # (reportlab, python-barcode, qrcode, pillow) penjadwal (APScheduler) dan requests; PyPDF2 + httpx untuk uji laporan dan unduhan Asisten AI — semuanya dipakai produksi.
          pip install pytest pytest-xdist $(grep -iE '^(fastapi|pydantic|starlette|PyJWT|bcrypt|motor|pymongo|python-dotenv|python-multipart|openpyxl|et_xmlfile|python-dateutil|six|reportlab|python-barcode|qrcode|pillow|APScheduler|tzlocal|requests|PyPDF2|httpx)==' backend/requirements.txt)
          cd backend && python -m pytest tests/unit -n 0 -q
      - name: Gate statis (T-01 authz · T-03/T-17 koleksi hantu · T-21 to_list(None))
        run: |
          python3 scripts/audit_authz.py --gate
          python3 scripts/check_collection_writers.py --gate
          python3 scripts/check_unbounded_queries.py --gate
          python3 scripts/guardrails/check_finance_ui.py   # menu & tampilan Portal Keuangan (2026-11-04)
          python3 scripts/ui_audit/scan_ui.py --portal all --gate   # pola UI SEMUA portal tidak boleh memburuk (docs/design/PANDUAN_UI.md)

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          # yarn.lock sengaja tidak di-commit (scripts/push_github.sh) → kunci cache dari package.json
          cache-dependency-path: frontend/package.json
      - name: Install (lockfile beku)
        working-directory: frontend
        run: yarn install --frozen-lockfile --network-timeout 600000
      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://ci.invalid
          CI: "false"
        run: yarn build
